[project]
name = "airflow-superglm-builder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "apache-airflow-providers-microsoft-mssql",
  "mlflow",
  "numpy",
  "openpyxl",
  "pandas",
  "pyodbc",
  "python-dotenv",
  "scikit-learn",
  "sqlalchemy",
  "superglm @ git+https://github.com/StrudelDoodleS/superglm.git@592891b6e405fdfa90e35ff39a16b8ebd5eb84f6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
