[project]
name = "airflow-superglm-builder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "apache-airflow==3.2.1",
  "apache-airflow-providers-microsoft-mssql",
  "azure-identity",
  "numpy",
  "openpyxl",
  "pandas",
  "pydantic>=2.13,<3",
  "pyodbc",
  "python-dotenv",
  "scikit-learn",
  "sqlalchemy",
  "superglm @ git+https://github.com/StrudelDoodleS/superglm.git@42e8c05f01ab358b280050bad4e09753386245e6",
]

[project.optional-dependencies]
mlflow = ["mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "sqlfluff>=4.2.1",
]
