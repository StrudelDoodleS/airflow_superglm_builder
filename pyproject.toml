[project]
name = "airflow-superglm-builder"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "azure-identity",
  "joblib",
  "numpy",
  "openpyxl",
  "packaging",
  "pandas",
  "pyarrow>=23.0.1",
  "plotly>=6.9",
  "pydantic>=2.13,<3",
  "pyodbc",
  "python-dotenv",
  "scikit-learn",
  "sqlalchemy",
  "superglm>=0.26",
]

[project.optional-dependencies]
mlflow = ["mlflow"]
scratch = [
    "catboost",
    "lightgbm",
    "matplotlib",
    "scipy",
    "xgboost",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
    "sqlfluff>=4.2.1",
]
